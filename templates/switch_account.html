
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Switch Account - MU Marketplace</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f3ff;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #5b21b6;
            text-align: center;
            margin-bottom: 12px;
            font-size: 26px;
        }

        .description {
            color: #666;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .account-info {
            background: #f5f3ff;
            border-radius: 9px;
            padding: 15px;
            text-align: center;
            margin-bottom: 25px;
        }

        .account-info p {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .account-info strong {
            color: #5b21b6;
            font-size: 17px;
        }

        label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 20px;
            outline: none;
        }

        input:focus {
            border-color: #6d28d9;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #6d28d9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5b21b6;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #6d28d9;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>

<link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
</head>

<body>

    <div class="container">

        <h1>Switch Account</h1>

        <p class="description">
            Enter your password to access your other
            MU Marketplace account.
        </p>

        <div class="account-info">
            <p>Currently using</p>
            <strong>{{ current_role|capitalize }} Account</strong>
            <p style="margin-top: 12px;">Switching to</p>
            <strong>{{ target_role|capitalize }} Account</strong>
        </div>

        <form method="POST">

            <label for="password">
                Confirm Your Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Switch to {{ target_role|capitalize }}
            </button>

        </form>

        <a
            href="{{ url_for('dashboard') }}"
            class="back-link"
        >
            Cancel and return to dashboard
        </a>

    </div>

<script src="{{ url_for('static', filename='js/pull-to-refresh.js') }}" defer></script>
</body>
</html>
