<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Review Product | MU Marketplace</title><style>body{font-family:Arial;background:#f4f5f9;padding:30px}.card{max-width:650px;margin:auto;background:white;padding:25px;border-radius:12px}label{display:block;margin:14px 0 6px}select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:7px;box-sizing:border-box}textarea{min-height:130px}button,a{display:inline-block;background:#2e05c2;color:white;padding:11px 17px;border:0;border-radius:7px;text-decoration:none}</style></head><body><div class="card"><a href="{{ url_for('buyer_dashboard') }}">Back to Dashboard</a><h1>Review {{ product.name }}</h1><form method="POST"><label>Rating</label><select name="rating" required><option value="">Choose a rating</option><option value="5">5 - Excellent</option><option value="4">4 - Very good</option><option value="3">3 - Good</option><option value="2">2 - Fair</option><option value="1">1 - Poor</option></select><label>Your review</label><textarea name="review" maxlength="1500" required></textarea><button type="submit">Submit Review</button></form></div><script src="{{ url_for('static', filename='js/pull-to-refresh.js') }}" defer></script>
</body></html>
