
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | MU Marketplace</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6f4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            color: #123c2c;
            text-align: center;
        }

        p {
            color: #666;
            margin: 15px 0;
            text-align: center;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            background: #123c2c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            color: #123c2c;
        }

        .message {
            background: #e8f3eb;
            padding: 10px;
            margin: 12px 0;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Forgot Password?</h1>

        <p>
            Enter your email and account type.
            We'll send a password-reset link if an account matches.
        </p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="role">Account Type</label>

            <select id="role" name="role" required>
                <option value="">Select account type</option>
                <option value="buyer">Buyer</option>
                <option value="seller">Seller</option>
            </select>

            <button type="submit">
                Send Reset Link
            </button>

        </form>

        <p>
            <a href="{{ url_for('login') }}">Back to Login</a>
        </p>

    </div>
<script src="{{ url_for('static', filename='js/pull-to-refresh.js') }}" defer></script>
</body>
</html>
