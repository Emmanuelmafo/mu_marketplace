
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MU Marketplace</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #123c2c;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .show-password {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: -8px;
        }

        .show-password input {
            width: auto;
            margin: 0;
        }

        .show-password label {
            margin: 0;
            font-weight: normal;
        }

        .forgot-password {
            text-align: right;
            margin: 15px 0;
        }

        a {
            color: #123c2c;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #123c2c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1b5940;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .message {
            background: #f1f1f1;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
    </style>

<link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
</head>

<body>

    <div class="login-card">

        <h2>MU Marketplace Login</h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <div class="show-password">
                <input
                    type="checkbox"
                    id="showPassword"
                    onclick="togglePassword()"
                >
                <label for="showPassword">Show Password</label>
            </div>

            <p class="forgot-password">
                <a href="{{ url_for('forgot_password') }}">
                    Forgot Password?
                </a>
            </p>

            <button type="submit">Login</button>

        </form>

        <div class="links">
            <p>Don't have an account?
                <a href="{{ url_for('register') }}">Register</a>
            </p>

            <p style="margin-top: 12px;">
                <a href="{{ url_for('home') }}">Back to Home</a>
            </p>
        </div>

    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const checkbox = document.getElementById("showPassword");

            password.type = checkbox.checked ? "text" : "password";
        }
    </script>

<script src="{{ url_for('static', filename='js/pull-to-refresh.js') }}" defer></script>
</body>
</html>
