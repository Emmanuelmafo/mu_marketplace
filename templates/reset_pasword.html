
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | MU Marketplace</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6f4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            color: #123c2c;
            text-align: center;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #123c2c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .message {
            background: #e8f3eb;
            padding: 10px;
            margin: 12px 0;
            border-radius: 5px;
        }

        .show-password {
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Reset Password</h1>

        <p>Create your new password below.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label for="password">New Password</label>

            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                required
            >

            <label for="confirm_password">Confirm Password</label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                minlength="8"
                required
            >

            <div class="show-password">
                <input
                    type="checkbox"
                    id="showPassword"
                    onclick="togglePasswords()"
                >
                <label for="showPassword">
                    Show passwords
                </label>
            </div>

            <button type="submit">
                Update Password
            </button>

        </form>

    </div>

    <script>
        function togglePasswords() {
            const type = document.getElementById(
                "showPassword"
            ).checked ? "text" : "password";

            document.getElementById("password").type = type;
            document.getElementById("confirm_password").type = type;
        }
    </script>

<script src="{{ url_for('static', filename='js/pull-to-refresh.js') }}" defer></script>
</body>
</html>
