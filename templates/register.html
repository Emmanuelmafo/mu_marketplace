
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | MU Marketplace</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #7e97af;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            color: #07e0bc;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #291d1d;
            border-radius: 5px;
            font-size: 15px;
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 75px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            margin: 0;
            padding: 5px;
            background: transparent;
            color: #123c2c;
            border: none;
            font-size: 13px;
            cursor: pointer;
        }

        .toggle-password:hover {
            background: transparent;
            color: #1b5940;
        }

        .password-hint {
            color: #666;
            font-size: 13px;
            margin-top: 7px;
        }

        .submit-button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #123c2c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #1b5940;
        }

        .message {
            background: #e8f3eb;
            color: #123c2c;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #123c2c;
        }
    .optional-field{font-size:12px;color:#718078;font-weight:500}
</style>
</head>

<body>

    <div class="container">

        <h1>MU Marketplace</h1>

        <p class="subtitle">Create your marketplace account</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">

            <label for="full_name">Full Name</label>
            <input
                type="text"
                id="full_name"
                name="full_name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
                minlength="7"
            >

            <label for="password">Password</label>

            <div class="password-container">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    id="togglePassword"
                >
                    Show
                </button>
            </div>

            <p class="password-hint">
                Password must contain at least 8 characters.
                Letters, numbers and symbols are allowed.
            </p>

            <label for="role">Account Type</label>
            <select id="role" name="role" required>
                <option value="buyer">Buyer</option>
                <option value="seller">Seller</option>
            </select>

            <button type="submit" class="submit-button">
                Create Account
            </button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Log in</a>
        </p>

        <p class="login-link">
            <a href="{{ url_for('home') }}">Back to Home</a>
        </p>

    </div>

    <script>
        const passwordInput = document.getElementById("password");
        const toggleButton = document.getElementById("togglePassword");

        toggleButton.addEventListener("click", function () {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleButton.textContent = "Hide";
            } else {
                passwordInput.type = "password";
                toggleButton.textContent = "Show";
            }
        });
    </script>

<script src="{{ url_for('static', filename='js/pull-to-refresh.js') }}" defer></script>
</body>
</html>
